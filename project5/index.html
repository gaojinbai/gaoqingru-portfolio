      function openImageDatabase() {
        if (imageDatabasePromise) return imageDatabasePromise;
        imageDatabasePromise = new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) {
            reject(new Error('IndexedDB is unavailable'));
            return;
          }
          const request = indexedDB.open(IMAGE_DB_NAME, 1);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(IMAGE_STORE_NAME)) {
              database.createObjectStore(IMAGE_STORE_NAME, { keyPath: 'id' });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('Unable to open image database'));
          request.onblocked = () => reject(new Error('Image database is blocked'));
        });
        return imageDatabasePromise;
      }

      function imageRecordId(index) {
        return `${IMAGE_STORAGE_SCOPE}::${index}`;
      }

      function waitForTransaction(transaction) {
        return new Promise((resolve, reject) => {
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error || new Error('Image transaction failed'));
          transaction.onabort = () => reject(transaction.error || new Error('Image transaction was aborted'));
        });
      }

      async function savePersistedImage(index, file, color) {
        const database = await openImageDatabase();
        const transaction = database.transaction(IMAGE_STORE_NAME, 'readwrite');
        transaction.objectStore(IMAGE_STORE_NAME).put({
          id: imageRecordId(index),
          scope: IMAGE_STORAGE_SCOPE,
          index,
          blob: file,
          filename: file.name || `画面-${index + 1}`,
          color: [...color],
          updatedAt: Date.now()
        });
        await waitForTransaction(transaction);
      }

      async function getPersistedImages() {
        const database = await openImageDatabase();
        const transaction = database.transaction(IMAGE_STORE_NAME, 'readonly');
        const request = transaction.objectStore(IMAGE_STORE_NAME).getAll();
        const records = await new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error || new Error('Unable to read saved images'));
        });
        return records.filter(record => record.scope === IMAGE_STORAGE_SCOPE);
      }

        const database = await openImageDatabase();
        const transaction = database.transaction(IMAGE_STORE_NAME, 'readwrite');

        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);

          reader.readAsDataURL(blob);

      function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        let h = 0;
        const l = (max + min) / 2;
        const s = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
        if (delta) {
          if (max === r) h = 60 * (((g - b) / delta) % 6);
          else if (max === g) h = 60 * ((b - r) / delta + 2);
          else h = 60 * ((r - g) / delta + 4);
        }
        return [(h + 360) % 360, s, l];
      }

      function hslToRgb(h, s, l) {
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs((h / 60) % 2 - 1));
        const m = l - c / 2;
        let rgb;
        if (h < 60) rgb = [c, x, 0];
        else if (h < 120) rgb = [x, c, 0];
        else if (h < 180) rgb = [0, c, x];
        else if (h < 240) rgb = [0, x, c];
        else if (h < 300) rgb = [x, 0, c];
        else rgb = [c, 0, x];
        return rgb.map(value => Math.round((value + m) * 255));
      }

      function polishGlowColor(color) {
        const [h, s, l] = rgbToHsl(...color);
        return hslToRgb(h, Math.max(.52, Math.min(.88, s * 1.22)), Math.max(.52, Math.min(.72, l)));
      }

      function extractDominantColor(dataUrl, fallback) {
        return new Promise(resolve => {
          const sampleImage = new Image();
          sampleImage.onload = () => {
            try {
              const size = 56;
              const sampleCanvas = document.createElement('canvas');
              sampleCanvas.width = size;
              sampleCanvas.height = size;
              const sampleContext = sampleCanvas.getContext('2d', { willReadFrequently: true });
              sampleContext.drawImage(sampleImage, 0, 0, size, size);
              const pixels = sampleContext.getImageData(0, 0, size, size).data;
              const buckets = Array.from({ length: 24 }, () => ({ weight: 0, r: 0, g: 0, b: 0 }));

              for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                  const offset = (y * size + x) * 4;
                  const alpha = pixels[offset + 3] / 255;
                  if (alpha < .65) continue;
                  const r = pixels[offset];
                  const g = pixels[offset + 1];

                  bucket.r += r * weight;
                  bucket.g += g * weight;
                  bucket.b += b * weight;

                dominant.r / dominant.weight,
                dominant.g / dominant.weight,
                dominant.b / dominant.weight

        editableNodes.forEach(node => state.text[node.dataset.edit] = node.innerHTML);
        const snapshot = document.getElementById('portfolio-snapshot');
        snapshot.textContent = JSON.stringify(state).replace(/</g, '\\u003c');
        const wasOpen = document.body.classList.contains('editor-open');
        setEditing(false);
        const source = '<!doctype html>\n' + document.documentElement.outerHTML;
        if (wasOpen) setEditing(true);
        return source;
      }

      function downloadPortableHtml(source) {
        const blob = new Blob([source], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '归鸟作品集.html';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      }

      document.getElementById('exportPage').addEventListener('click', async () => {
        const source = createPortableHtmlSource();
        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: '归鸟作品集.html',
              types: [{ description: 'HTML 网页', accept: { 'text/html': ['.html'] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(source);
            await writable.close();
            showToast('已导出备份');
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') {
              showToast('已取消保存，原文件没有改变');
              return;
            }
            console.warn('无法直接保存 HTML，改为下载副本：', error);
          }
        }
        downloadPortableHtml(source);
        showToast('已下载统一版 HTML；请用它替换根目录中的原文件');
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && document.body.classList.contains('editor-open')) setEditing(false);
        if (!document.body.classList.contains('editor-open') && event.key === 'ArrowRight') goToScene(current + 1, 1);
        if (!document.body.classList.contains('editor-open') && event.key === 'ArrowLeft') goToScene(current - 1, -1);
      });
    })();
  </script>

  <script>
    (() => {
      const section = document.getElementById('journeySection');
      const stage = document.getElementById('journeyStage');
      const cards = [...document.querySelectorAll('[data-journey-card]')];
      const dots = [...document.querySelectorAll('[data-journey-dot]')];
      const count = document.getElementById('journeyCount');
      const tools = document.getElementById('journeyTools');
      let active = 0;
      let drag = null;
      let selectedText = null;

      function signedDistance(index) {
        let distance = index - active;
        if (distance > cards.length / 2) distance -= cards.length;
        if (distance < -cards.length / 2) distance += cards.length;
        return distance;
      }

      function renderCarousel(dragOffset = 0) {
        const spacing = Number(document.getElementById('journeySpacing').value);
        cards.forEach((card, index) => {
          const distance = signedDistance(index);
          const abs = Math.abs(distance);
          const x = distance * spacing + dragOffset;
          const scale = Math.max(.64, 1 - abs * .075) * (distance === 0 ? 1.1 : 1);
          card.style.setProperty('--card-x', x + 'px');
          card.style.setProperty('--card-scale', scale);
          card.style.setProperty('--card-rotate', distance * -1.35 + 'deg');
          card.style.zIndex = String(20 - abs);
          card.style.opacity = abs > 4 ? '0' : String(Math.max(.32, 1 - abs * .13));
          card.style.filter = abs > 2 ? 'saturate(.84)' : 'none';
          card.style.pointerEvents = abs > 4 ? 'none' : 'auto';
          card.setAttribute('aria-current', distance === 0 ? 'true' : 'false');
        });
        dots.forEach((dot, index) => dot.classList.toggle('active', index === active));
        count.textContent = String(active + 1).padStart(2, '0') + ' / 09';
        syncImageControls();
      }

      function goTo(index) {
        active = (index + cards.length) % cards.length;
        renderCarousel();
      }
      document.getElementById('journeyPrev').addEventListener('click', () => goTo(active - 1));
      document.getElementById('journeyNext').addEventListener('click', () => goTo(active + 1));
      dots.forEach(dot => dot.addEventListener('click', () => goTo(Number(dot.dataset.journeyDot))));
      cards.forEach(card => card.addEventListener('click', event => {
        if (event.target.closest('label,input,[contenteditable="true"]')) return;
        goTo(Number(card.dataset.journeyCard));
      }));

      stage.addEventListener('pointerdown', event => {
        if (event.target.closest('button,label,input,[contenteditable="true"]')) return;
        drag = { id: event.pointerId, start: event.clientX, offset: 0 };
        stage.classList.add('dragging');
        stage.setPointerCapture(event.pointerId);
      });
      stage.addEventListener('pointermove', event => {
        if (!drag || drag.id !== event.pointerId) return;
        drag.offset = event.clientX - drag.start;
        renderCarousel(drag.offset);
      });
      function endDrag(event) {
        if (!drag || drag.id !== event.pointerId) return;
        const threshold = Math.min(90, stage.clientWidth * .09);
        if (Math.abs(drag.offset) > threshold) active += drag.offset < 0 ? 1 : -1;
        drag = null;
        stage.classList.remove('dragging');
        goTo(active);
      }
      stage.addEventListener('pointerup', endDrag);
      stage.addEventListener('pointercancel', endDrag);
      stage.addEventListener('wheel', event => {
        if (Math.abs(event.deltaX) <= Math.abs(event.deltaY)) return;
        event.preventDefault();
        goTo(active + (event.deltaX > 0 ? 1 : -1));
      }, { passive: false });

      document.querySelectorAll('[data-journey-upload]').forEach(input => input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        const card = cards[Number(input.dataset.journeyUpload)];
        const reader = new FileReader();
        reader.onload = () => {
          card.querySelector('.journey-card__image').src = reader.result;
          card.classList.add('has-image');
          goTo(Number(card.dataset.journeyCard));
        };
        reader.readAsDataURL(file);
      }));

      function syncImageControls() {
        const card = cards[active];
        document.getElementById('journeyImageScale').value = Math.round(Number(card.dataset.imageScale || 1) * 100);
        document.getElementById('journeyImageX').value = Number(card.dataset.imageX || 0);
        document.getElementById('journeyImageY').value = Number(card.dataset.imageY || 0);
      }
      function updateActiveImage() {
        const card = cards[active];
        const scale = Number(document.getElementById('journeyImageScale').value) / 100;
        const x = Number(document.getElementById('journeyImageX').value);
        const y = Number(document.getElementById('journeyImageY').value);
        card.dataset.imageScale = scale;
        card.dataset.imageX = x;
        card.dataset.imageY = y;
        card.style.setProperty('--image-scale', scale);
        card.style.setProperty('--image-x', x + '%');
        card.style.setProperty('--image-y', y + '%');
      }
      ['journeyImageScale','journeyImageX','journeyImageY'].forEach(id => document.getElementById(id).addEventListener('input', updateActiveImage));
      document.getElementById('journeySpacing').addEventListener('input', event => {
        section.style.setProperty('--journey-spacing', event.target.value + 'px');
        renderCarousel();
      });
      document.getElementById('journeyCopyGap').addEventListener('input', event => section.style.setProperty('--journey-copy-gap', event.target.value + 'px'));

      document.querySelectorAll('[data-journey-edit]').forEach(node => node.addEventListener('focus', () => {
        if (selectedText) selectedText.classList.remove('selected');
        selectedText = node;
        node.classList.add('selected');
        const style = getComputedStyle(node);
        document.getElementById('journeyFontSize').value = Math.round(parseFloat(style.fontSize));
        document.getElementById('journeyLetterSpacing').value = parseFloat(style.letterSpacing) || 0;
      }));
      document.getElementById('journeyFontSize').addEventListener('input', event => { if (selectedText) selectedText.style.fontSize = event.target.value + 'px'; });
      document.getElementById('journeyLetterSpacing').addEventListener('input', event => { if (selectedText) selectedText.style.letterSpacing = event.target.value + 'px'; });
      document.getElementById('journeySettingsToggle').addEventListener('click', () => tools.classList.toggle('open'));
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(entries => {
          document.body.classList.toggle('journey-visible', entries[0].isIntersecting);
        }, { threshold: .18 }).observe(section);
      }
      addEventListener('resize', () => renderCarousel());
      renderCarousel();
    })();
  </script>

  <script>
    (() => {
      const section = document.getElementById('archiveSection');
      const tools = document.getElementById('archiveTools');
      const cards = [...document.querySelectorAll('[data-archive-card]')];
      let active = 0;
      let selectedText = null;

      function selectCard(index) {
        active = index;
        cards.forEach((card,i) => card.classList.toggle('active', i === active));
        const card = cards[active];
        document.getElementById('archiveImageScale').value = Math.round(Number(card.dataset.imageScale || 1) * 100);
        document.getElementById('archiveImageX').value = Number(card.dataset.imageX || 0);
        document.getElementById('archiveImageY').value = Number(card.dataset.imageY || 0);
      }
      cards.forEach(card => card.addEventListener('click', event => {
        if (event.target.closest('label,input,[contenteditable="true"]')) return;
        selectCard(Number(card.dataset.archiveCard));
      }));
      document.querySelectorAll('[data-archive-upload]').forEach(input => input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        const index = Number(input.dataset.archiveUpload);
        const card = cards[index];
        const reader = new FileReader();
        reader.onload = () => {
          card.querySelector('.archive-image').src = reader.result;
          card.classList.add('has-image');
          selectCard(index);
        };
        reader.readAsDataURL(file);
      }));
      function updateImage() {
        const card = cards[active];
        const scale = Number(document.getElementById('archiveImageScale').value) / 100;
        const x = Number(document.getElementById('archiveImageX').value);
        const y = Number(document.getElementById('archiveImageY').value);
        card.dataset.imageScale = scale;
        card.dataset.imageX = x;
        card.dataset.imageY = y;
        card.style.setProperty('--archive-image-scale', scale);
        card.style.setProperty('--archive-image-x', x + '%');
        card.style.setProperty('--archive-image-y', y + '%');
      }
      ['archiveImageScale','archiveImageX','archiveImageY'].forEach(id => document.getElementById(id).addEventListener('input', updateImage));
      document.getElementById('archiveGap').addEventListener('input', event => section.style.setProperty('--archive-gap', event.target.value + 'px'));
      document.getElementById('archiveCopyGap').addEventListener('input', event => section.style.setProperty('--archive-copy-gap', event.target.value + '%'));
      document.querySelectorAll('[data-archive-edit]').forEach(node => node.addEventListener('focus', () => {
        if (selectedText) selectedText.classList.remove('selected');
        selectedText = node;
        node.classList.add('selected');
        const style = getComputedStyle(node);
        document.getElementById('archiveFontSize').value = Math.round(parseFloat(style.fontSize));
        document.getElementById('archiveLetterSpacing').value = parseFloat(style.letterSpacing) || 0;
      }));
      document.getElementById('archiveFontSize').addEventListener('input', event => { if (selectedText) selectedText.style.fontSize = event.target.value + 'px'; });
      document.getElementById('archiveLetterSpacing').addEventListener('input', event => { if (selectedText) selectedText.style.letterSpacing = event.target.value + 'px'; });
      document.getElementById('archiveSettingsToggle').addEventListener('click', () => tools.classList.toggle('open'));
      if ('IntersectionObserver' in window) new IntersectionObserver(entries => document.body.classList.toggle('archive-visible', entries[0].isIntersecting), { threshold: .16 }).observe(section);
      selectCard(0);
    })();
  </script>
  <style>
    /* 发布版：隐藏全部编辑工作台与上传入口 */
    .editor, .editor-backdrop, .settings-toggle,

    .archive-settings-toggle, .archive-tools, .archive-upload,
    .upload-label, .upload-grid, .media-direct-upload { display: none !important; }
    [contenteditable] { pointer-events: none; }
